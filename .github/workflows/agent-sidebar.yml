# Fork addition (agent-sidebar): build the macOS app on a GitHub-hosted
# runner so the sidebar code is compiled on every push to the fork branch.
name: agent-sidebar

on:
  push:
    branches: [agent-sidebar]
  workflow_dispatch:

# contents: write lets the job publish screenshots to a side branch.
permissions:
  contents: write

concurrency:
  group: agent-sidebar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ZIG_VERSION: 0.17.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Install Zig
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components 1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig/zig" version

      # GhosttyKit is the framework built from Zig that the Swift app links.
      - name: Build GhosttyKit
        run: zig build -Demit-macos-app=false

      - name: Build Ghostty.app
        run: |
          set -o pipefail
          xcodebuild -project macos/Ghostty.xcodeproj -scheme Ghostty \
            -configuration Debug SYMROOT="$PWD/macos/build" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*Agent Sidebar|BUILD (SUCCEEDED|FAILED)|^\*\*" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/xcodebuild.log"

      - name: Compiler errors
        if: failure()
        run: grep -n -B2 -A12 "error:" "$RUNNER_TEMP/xcodebuild.log" | head -400 || true

      # Ad-hoc signature so the downloaded app can start on Apple Silicon.
      - name: Ad-hoc sign
        run: codesign --force --deep --sign - macos/build/Debug/Ghostty.app

      - name: Package app
        run: ditto -c -k --keepParent macos/build/Debug/Ghostty.app "$RUNNER_TEMP/Ghostty-agent-sidebar-debug.zip"

      # Launch the app with sample sidebar content and capture the screen in
      # light and dark appearance, so the UI can be reviewed without a Mac.
      - name: Screenshots
        continue-on-error: true
        run: agent-sidebar/ci-screenshots.sh "$PWD/macos/build/Debug/Ghostty.app" "$RUNNER_TEMP/shots"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn
          retention-days: 14

      # Also publish the screenshots to a side branch so they can be viewed
      # (and fetched with git) without downloading an artifact.
      - name: Publish screenshots
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/shots"
          ls *.png >/dev/null 2>&1 || exit 0
          echo "Screenshots of commit $GITHUB_SHA" > README.md
          git init -q -b agent-sidebar-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Screenshots of $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" agent-sidebar-screenshots

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Ghostty-agent-sidebar-debug
          path: ${{ runner.temp }}/Ghostty-agent-sidebar-debug.zip
          retention-days: 14
